  <text x="340" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#aaa" letter-spacing="2" style="fill:rgb(170, 170, 170);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">PT. INDUSTRI NABATI LESTARI · SIMALUNGUN</text>
